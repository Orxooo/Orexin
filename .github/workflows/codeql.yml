name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-26
            build-mode: manual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode for Swift analysis
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift sources
        if: matrix.language == 'swift'
        run: swift build --arch arm64 --scratch-path "$RUNNER_TEMP/orexin-codeql"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
