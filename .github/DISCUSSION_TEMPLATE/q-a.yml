title: ''
body:
  - type: markdown
    attributes:
      value: |
        欢迎提问 / Welcome! 请先阅读 README 与 Wiki。
        不要粘贴密码、令牌或包含私人信息的日志。安全漏洞请使用私密报告入口。
  - type: input
    id: environment
    attributes:
      label: 版本与环境 / Version and environment
      description: Orexin 版本、macOS 版本、芯片型号。
      placeholder: V1.0.1 · macOS 26 · Apple Silicon
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 你想完成什么 / What would you like to do?
      description: 说明目标、已尝试的操作和实际结果。
    validations:
      required: true
