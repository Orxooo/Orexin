<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">Orexin — Stay awake. Rest on time.</title>
  <desc id="description">A midnight-blue power terminal with a luminous crescent, orbital marks and a work-to-rest timeline. Native macOS utility.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#101e2b"/><stop offset="1" stop-color="#050b12"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcff"/><stop offset=".48" stop-color="#71e9ea"/><stop offset="1" stop-color="#3765da"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#24b8ce" stop-opacity=".16"/><stop offset="1" stop-color="#24b8ce" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#809bac" stroke-opacity=".07"/></pattern>
    <mask id="crescent"><rect width="1280" height="520" fill="black"/><circle cx="1005" cy="245" r="100" fill="white"/><circle cx="1055" cy="204" r="94" fill="black"/></mask>
  </defs>
  <rect width="1280" height="520" rx="18" fill="url(#night)"/>
  <rect width="1280" height="520" rx="18" fill="url(#grid)"/>
  <circle cx="1005" cy="245" r="244" fill="url(#halo)"/>
  <g fill="none" stroke="#6a8799" stroke-opacity=".35"><path d="M32 62V32H62M1218 32H1248V62M32 458V488H62M1218 488H1248V458"/><path d="M64 403H1216"/></g>
  <g font-family="'IBM Plex Mono', 'SFMono-Regular', monospace" font-size="13" letter-spacing="2" fill="#a0bac5">
    <text x="66" y="76">OREXIN / POWER TERMINAL</text>
    <text x="1214" y="76" text-anchor="end">NATIVE macOS</text>
  </g>
  <text x="62" y="192" fill="#e4f4f7" font-family="Arial, sans-serif" font-weight="700" font-size="91" letter-spacing="-4">Orexin.</text>
  <g font-family="Arial, sans-serif" font-size="42" letter-spacing="-.8">
    <text x="66" y="263" fill="#e4f4f7">Stay awake.</text>
    <text x="66" y="315" fill="#66dce5">Rest on time.</text>
  </g>
  <text x="68" y="363" fill="#97aebb" font-family="Arial, sans-serif" font-size="17">Work sessions, screen control, and a quieter finish.</text>
  <g fill="none" stroke="#6ba9ba" stroke-opacity=".3">
    <circle cx="1005" cy="245" r="143"/>
    <circle cx="1005" cy="245" r="174" stroke-dasharray="2 13"/>
    <path d="M1005 61V78M1005 412V429M821 245H838M1172 245H1189"/>
  </g>
  <path d="M883 320A143 143 0 0 0 1130 176" fill="none" stroke="#44d4e1" stroke-width="2"/>
  <circle cx="1130" cy="176" r="5" fill="#66e5e6"/>
  <rect x="890" y="132" width="220" height="225" fill="url(#moon)" mask="url(#crescent)"/>
  <g font-family="'IBM Plex Mono', 'SFMono-Regular', monospace" font-size="12" letter-spacing="1.5">
    <circle cx="72" cy="447" r="4" fill="#66e5e6"/><text x="89" y="451" fill="#d0e5ea">START A SESSION</text>
    <path d="M278 447H337M330 442L337 447L330 452" fill="none" stroke="#496372"/>
    <circle cx="364" cy="447" r="4" fill="#66e5e6"/><text x="381" y="451" fill="#d0e5ea">GET WORK DONE</text>
    <path d="M557 447H616M609 442L616 447L609 452" fill="none" stroke="#496372"/>
    <circle cx="643" cy="447" r="4" fill="#f2ac79"/><text x="660" y="451" fill="#d0e5ea">LET YOUR MAC REST</text>
    <text x="1214" y="451" text-anchor="end" fill="#7c96a4">OPEN SOURCE / GPL-3.0</text>
  </g>
</svg>
